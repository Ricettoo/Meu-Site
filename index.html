<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Ricetto | Dev & Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #111114;
            --accent: #00ff41; 
            --text: #e1e1e6;
            --secondary: #8257e5; 
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Fira Code', monospace;
            margin: 0;
            /* Centralização Total */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centraliza verticalmente */
            min-height: 100vh;      /* Garante que o corpo tenha a altura da tela */
            padding: 20px;
            box-sizing: border-box;
        }

        .container { max-width: 800px; width: 100%; text-align: center; }

        header { margin-bottom: 40px; }
        h1 { color: var(--accent); font-size: 2.2rem; margin-bottom: 10px; }
        .subtitle { opacity: 0.8; font-size: 1rem; color: var(--secondary); margin-bottom: 20px; }

        .links { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .links a { 
            color: var(--text); 
            text-decoration: none; 
            border: 1px solid #333; 
            padding: 10px 20px; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            transition: 0.3s;
            background: var(--card-bg);
        }
        .links a:hover { 
            border-color: var(--accent); 
            background: #1a1a1e; 
            transform: translateY(-2px);
        }

        footer { margin-top: 60px; font-size: 0.8rem; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>> gabriel_ricetto</h1>
            <p class="subtitle">Computer Science Student @ UNESPAR</p>
            
            <div class="links">
                <a href="https://github.com/Ricettoo" target="_blank">
                    <i data-lucide="github"></i> GitHub
                </a>
                <a href="https://www.linkedin.com/in/ricettoo/" target="_blank">
                    <i data-lucide="linkedin"></i> LinkedIn
                </a>
            </div>
        </header>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
